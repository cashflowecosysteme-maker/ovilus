<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livres Audio — NyXia</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400&family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--p:#7B5CFF;--p2:#5A6CFF;--p3:#4FA3FF;--gold:#F4C842;--t:#fff;--t2:#D6D9F0;--t3:#8891B8}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Outfit',sans-serif;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(60,20,120,0.45),transparent 70%),#0a0a18;color:var(--t2);min-height:100%;padding:30px 18px 60px}
.wrap{max-width:640px;margin:0 auto}
h1{font-family:'Cormorant Garamond',serif;font-size:clamp(24px,5vw,36px);font-weight:400;color:#fff;text-align:center;margin-bottom:6px}
.sub{text-align:center;color:var(--t3);font-size:13px;margin-bottom:26px;line-height:1.6}
.item{background:rgba(26,20,52,0.55);border:1px solid rgba(123,92,255,0.2);border-radius:16px;padding:18px 20px;margin-bottom:14px}
.item .top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.item .ic{font-size:26px}
.item h3{font-family:'Space Grotesk',sans-serif;font-size:15px;color:#fff}
.item audio{width:100%;outline:none}
.empty{text-align:center;color:var(--t3);font-size:14px;padding:40px 10px;line-height:1.7}
</style>
</head>
<body>
<script>(function(){var t=new URLSearchParams(location.search).get("token");if(!t){location.replace("/login.html");return;}fetch("/api/check-auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:t})}).then(function(r){return r.json();}).then(function(d){if(!d.valid)location.replace("/login.html");}).catch(function(){location.replace("/login.html");});})();</script>

<div class="wrap">
  <h1>Livres Audio</h1>
  <div class="sub">Tes audios, à écouter dans ton espace — protégés, sans téléchargement. 🎧</div>
  <div id="list"></div>
</div>

<script>
var token = new URLSearchParams(location.search).get('token') || '';
fetch('/api/library?token=' + encodeURIComponent(token))
.then(function(r){ return r.json(); })
.then(function(data){
  var audios = (data.items||[]).filter(function(x){ return x.type === 'audio'; });
  var list = document.getElementById('list');
  if(!audios.length){ list.innerHTML = '<div class="empty">Aucun audio pour l\'instant.<br>Ajoute tes fichiers MP3 depuis ton superadmin — ils apparaîtront ici.</div>'; return; }
  audios.forEach(function(a){
    var el = document.createElement('div'); el.className = 'item';
    var top = document.createElement('div'); top.className = 'top';
    top.innerHTML = '<div class="ic">🎧</div><h3>' + escapeHtml(a.title) + '</h3>';
    var audio = document.createElement('audio');
    audio.controls = true; audio.preload = 'none';
    audio.controlsList = 'nodownload';
    audio.src = '/api/library/file?id=' + encodeURIComponent(a.id) + '&token=' + encodeURIComponent(token);
    el.appendChild(top); el.appendChild(audio);
    list.appendChild(el);
  });
})
.catch(function(){ document.getElementById('list').innerHTML = '<div class="empty">Connexion impossible.</div>'; });
function escapeHtml(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
</script>
</body>
</html>
