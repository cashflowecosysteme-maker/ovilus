<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bibliothèque — NyXia</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600&family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--p:#7B5CFF;--p2:#5A6CFF;--p3:#4FA3FF;--gold:#F4C842;--t:#fff;--t2:#D6D9F0;--t3:#8891B8}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Outfit',sans-serif;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(60,20,120,0.45),transparent 70%),#0a0a18;color:var(--t2);min-height:100%;padding:26px 18px 60px;
  -webkit-user-select:none;-moz-user-select:none;user-select:none}
.wrap{max-width:820px;margin:0 auto}
h1{font-family:'Cormorant Garamond',serif;font-size:clamp(24px,5vw,36px);font-weight:400;color:#fff;text-align:center;margin-bottom:6px}
.sub{text-align:center;color:var(--t3);font-size:13px;margin-bottom:24px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.book{padding:18px;border-radius:14px;border:1px solid rgba(123,92,255,0.22);background:rgba(26,20,52,0.55);cursor:pointer;transition:transform .2s,border-color .2s}
.book:hover{transform:translateY(-3px);border-color:rgba(196,181,253,0.55)}
.book .ic{font-size:26px;margin-bottom:8px}
.book h3{font-family:'Space Grotesk',sans-serif;font-size:15px;color:#fff}
.empty{text-align:center;color:var(--t3);font-size:14px;padding:40px 10px;line-height:1.6}

.reader{display:none;position:fixed;inset:0;z-index:50;background:#0a0a18;flex-direction:column}
.reader.on{display:flex}
.reader-bar{display:flex;align-items:center;gap:12px;padding:12px 18px;background:rgba(15,28,63,0.95);border-bottom:1px solid rgba(123,92,255,0.2)}
.reader-bar .title{font-family:'Space Grotesk',sans-serif;font-size:14px;color:#fff;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reader-bar button{background:none;border:1px solid rgba(123,92,255,0.3);color:var(--t2);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
.pages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;align-items:center;gap:16px}
.pages canvas{max-width:100%;border-radius:6px;box-shadow:0 4px 30px rgba(0,0,0,0.5)}
.loadmsg{color:var(--t3);font-size:13px;padding:20px}
canvas#starry-canvas{position:fixed;inset:0;z-index:-1;pointer-events:none}
</style>
</head>
<body>
<script>(function(){var t=new URLSearchParams(location.search).get("token");if(!t){location.replace("/login.html");return;}fetch("/api/check-auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:t})}).then(function(r){return r.json();}).then(function(d){if(!d.valid)location.replace("/login.html");}).catch(function(){location.replace("/login.html");});})();</script>
<div class="wrap">
  <h1>Ma bibliothèque</h1>
  <div class="sub">Tes ouvrages, en lecture protégée — à savourer, pas à emporter. 📚</div>
  <div class="shelf" id="shelf"></div>
</div>

<div class="reader" id="reader">
  <div class="reader-bar">
    <div class="title" id="readerTitle"></div>
    <button onclick="closeReader()">✕ Fermer</button>
  </div>
  <div class="pages" id="pages"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
var token = new URLSearchParams(location.search).get('token') || '';
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// Anti-copie (décourage, ne blinde pas) : clic droit, copie, impression
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('copy', function(e){ e.preventDefault(); });
document.addEventListener('keydown', function(e){
  if((e.ctrlKey||e.metaKey) && ['c','p','s'].indexOf(e.key.toLowerCase())!==-1){ e.preventDefault(); }
});

fetch('/api/library?token=' + encodeURIComponent(token))
.then(function(r){ return r.json(); })
.then(function(data){
  var books = (data.items||[]).filter(function(x){ return x.type === 'livre'; });
  var shelf = document.getElementById('shelf');
  if(!books.length){ shelf.innerHTML = '<div class="empty">Aucun livre pour l\'instant.<br>Ajoute tes ouvrages depuis ton superadmin — ils apparaîtront ici, protégés.</div>'; return; }
  books.forEach(function(b){
    var el = document.createElement('div'); el.className = 'book';
    el.innerHTML = '<div class="ic">📖</div><h3>' + escapeHtml(b.title) + '</h3>';
    el.addEventListener('click', function(){ openBook(b); });
    shelf.appendChild(el);
  });
})
.catch(function(){ document.getElementById('shelf').innerHTML = '<div class="empty">Connexion impossible.</div>'; });

function openBook(b){
  var reader = document.getElementById('reader');
  var pages = document.getElementById('pages');
  document.getElementById('readerTitle').textContent = b.title;
  pages.innerHTML = '<div class="loadmsg">Ouverture…</div>';
  reader.classList.add('on');
  if(!window.pdfjsLib){ pages.innerHTML = '<div class="loadmsg">Lecteur indisponible.</div>'; return; }
  var url = '/api/library/file?id=' + encodeURIComponent(b.id) + '&token=' + encodeURIComponent(token);
  pdfjsLib.getDocument(url).promise.then(function(pdf){
    pages.innerHTML = '';
    var renderNext = function(n){
      if(n > pdf.numPages) return;
      pdf.getPage(n).then(function(page){
        var vw = Math.min(pages.clientWidth - 40, 800);
        var unscaled = page.getViewport({ scale: 1 });
        var scale = vw / unscaled.width;
        var viewport = page.getViewport({ scale: scale });
        var canvas = document.createElement('canvas');
        canvas.width = viewport.width; canvas.height = viewport.height;
        pages.appendChild(canvas);
        page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise.then(function(){ renderNext(n+1); });
      });
    };
    renderNext(1);
  }).catch(function(){ pages.innerHTML = '<div class="loadmsg">Ce livre n\'a pas pu être ouvert.</div>'; });
}
function closeReader(){ document.getElementById('reader').classList.remove('on'); document.getElementById('pages').innerHTML=''; }
function escapeHtml(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
</script>
<canvas id="starry-canvas"></canvas>
<script src="/js/starry-bg.js"></script>
</body>
</html>
