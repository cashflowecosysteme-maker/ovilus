<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Numérologie — NyXia</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--p:#7B5CFF;--p2:#5A6CFF;--p3:#4FA3FF;--gold:#F4C842;--t:#fff;--t2:#D6D9F0;--t3:#8891B8}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(60,20,120,0.45),transparent 70%),#0a0a18;color:var(--t2);min-height:100vh;padding:34px 20px 60px}
.wrap{max-width:620px;margin:0 auto}
h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(26px,5vw,38px);text-align:center;color:#fff;margin-bottom:6px}
h1 em{font-style:italic;background:linear-gradient(135deg,#c4b5fd,var(--p3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;color:var(--t3);font-size:14px;margin-bottom:28px;line-height:1.6}
.card{background:rgba(26,20,52,0.55);border:1px solid rgba(123,92,255,0.2);border-radius:18px;padding:26px}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--t3);margin-bottom:7px;font-weight:700}
.field input{width:100%;padding:13px 15px;border-radius:12px;border:1px solid rgba(123,92,255,0.25);background:rgba(15,28,63,0.7);color:#fff;font-size:15px;outline:none}
.btn{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:700;font-size:15px;font-family:'Space Grotesk',sans-serif;cursor:pointer;margin-top:6px}
.result{display:none;margin-top:24px;text-align:center}
.result.on{display:block}
.big{font-family:'Space Grotesk',sans-serif;font-size:64px;font-weight:700;background:linear-gradient(135deg,#c4b5fd,var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.rlabel{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--p3);margin:8px 0 14px}
.rtext{font-size:15px;line-height:1.75;color:var(--t2)}
</style>
</head>
<body>
<script>(function(){var t=new URLSearchParams(location.search).get("token");if(!t){location.replace("/login.html");return;}fetch("/api/check-auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:t})}).then(function(r){return r.json();}).then(function(d){if(!d.valid)location.replace("/login.html");}).catch(function(){location.replace("/login.html");});})();</script>
<div class="wrap">
  <h1>Ta <em>Numérologie</em></h1>
  <div class="sub">Ton chemin de vie révèle l'énergie qui te traverse. Entre ta date de naissance. 🔢</div>
  <div class="card">
    <div class="field"><label>Date de naissance</label><input type="date" id="birth"></div>
    <button class="btn" onclick="calc()">Révéler mon chemin de vie</button>
    <div class="result" id="result">
      <div class="big" id="num"></div>
      <div class="rlabel">Chemin de vie</div>
      <div class="rtext" id="txt"></div>
    </div>
  </div>
</div>
<script>
var MEANINGS = {
  1:"Le chemin de l'initiative et de l'indépendance. Tu es fait(e) pour ouvrir la voie, oser, créer. Ta leçon : t'appuyer sur ta propre force sans t'isoler.",
  2:"Le chemin de la sensibilité et du lien. Diplomatie, écoute, coopération sont tes dons. Ta leçon : t'affirmer tout en restant à l'écoute.",
  3:"Le chemin de l'expression et de la joie. Créativité, parole, rayonnement te portent. Ta leçon : canaliser ta lumière plutôt que la disperser.",
  4:"Le chemin de la construction et de la stabilité. Rigueur, patience, ancrage bâtissent ton œuvre. Ta leçon : garder de la souplesse dans la structure.",
  5:"Le chemin de la liberté et du mouvement. Curiosité, changement, aventure t'appellent. Ta leçon : transformer l'agitation en exploration féconde.",
  6:"Le chemin de l'amour et de la responsabilité. Harmonie, soin, famille sont ton terrain. Ta leçon : donner sans t'oublier.",
  7:"Le chemin de la connaissance et de l'intériorité. Introspection, spiritualité, analyse t'élèvent. Ta leçon : partager ta sagesse plutôt que la garder.",
  8:"Le chemin du pouvoir et de la réalisation. Ambition, matière, justice te structurent. Ta leçon : mettre ta puissance au service de plus grand que toi.",
  9:"Le chemin de la compassion et du don. Universalité, art, altruisme te traversent. Ta leçon : accueillir aussi ce qui se termine pour renaître.",
  11:"Maître-nombre : l'inspiration et l'intuition. Tu es un pont entre les mondes, une âme sensible et lumineuse. Ta leçon : ancrer ta vision dans le réel.",
  22:"Maître-nombre : le bâtisseur d'idéal. Tu peux concrétiser de grands rêves au service du collectif. Ta leçon : oser la mesure de tes capacités.",
  33:"Maître-nombre : l'amour inconditionnel. Guérison, transmission, service élevé sont ta vibration. Ta leçon : prendre soin de toi autant que des autres."
};
function reduce(n){ while(n>9 && n!==11 && n!==22 && n!==33){ n = String(n).split('').reduce(function(a,b){return a+ +b;},0); } return n; }
function calc(){
  var v = document.getElementById('birth').value;
  if(!v){ return; }
  var digits = v.replace(/[^0-9]/g,'').split('').reduce(function(a,b){return a+ +b;},0);
  var life = reduce(digits);
  document.getElementById('num').textContent = life;
  document.getElementById('txt').textContent = MEANINGS[life] || '';
  document.getElementById('result').classList.add('on');
  document.getElementById('result').scrollIntoView({behavior:'smooth',block:'nearest'});
}
</script>
</body>
</html>
