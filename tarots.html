<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tirage de Tarot — NyXia</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--p:#7B5CFF;--p2:#5A6CFF;--p3:#4FA3FF;--gold:#F4C842;--t:#fff;--t2:#D6D9F0;--t3:#8891B8}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Outfit',sans-serif;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(60,20,120,0.5),transparent 70%),#0a0a18;color:var(--t2);min-height:100%;padding:26px 18px 60px}
.wrap{max-width:900px;margin:0 auto}
.intro{text-align:center;margin-bottom:26px}
.intro h1{font-family:'Cormorant Garamond',serif;font-size:clamp(26px,5vw,40px);font-weight:400;color:#fff;margin-bottom:8px}
.intro h1 em{font-style:italic;background:linear-gradient(135deg,#c4b5fd,var(--p3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.intro p{font-size:14px;color:var(--t3);max-width:560px;margin:0 auto;line-height:1.6}
.hero-nyxia{position:relative;display:flex;justify-content:center;align-items:center;min-height:246px;margin-bottom:14px}
.ny-glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:300px;height:300px;
  background:radial-gradient(ellipse 70% 80% at 50% 50%,rgba(123,92,255,0.55),rgba(100,60,200,0.28) 40%,transparent 72%);
  filter:blur(28px);animation:glowPulse 3.5s ease-in-out infinite;z-index:0;pointer-events:none}
.ny-float{position:relative;z-index:1;height:230px;border-radius:16px;object-fit:cover;
  filter:drop-shadow(0 0 28px rgba(123,92,255,0.5));animation:nyxiaFloat 4.5s ease-in-out infinite}
@keyframes glowPulse{0%,100%{opacity:.72;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.07)}}
@keyframes nyxiaFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:26px}
.choice{position:relative;text-align:left;padding:18px;border-radius:16px;border:1px solid rgba(123,92,255,0.22);
  background:rgba(26,20,52,0.55);cursor:pointer;overflow:hidden;transition:transform .2s,border-color .2s}
.choice::before{content:'';position:absolute;width:260px;height:260px;left:var(--mx,50%);top:var(--my,50%);
  transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(123,92,255,0.35),transparent 65%);
  opacity:0;transition:opacity .25s;pointer-events:none}
.choice:hover{transform:translateY(-3px);border-color:rgba(196,181,253,0.6)}
.choice:hover::before{opacity:1}
.choice .ic{font-size:26px;margin-bottom:8px}
.choice h3{font-family:'Space Grotesk',sans-serif;font-size:15px;color:#fff;margin-bottom:4px;position:relative}
.choice p{font-size:12px;color:var(--t3);position:relative}

.stage{display:none;margin-top:20px}
.stage.on{display:block}
.q-row{display:flex;gap:10px;margin:0 auto 22px;max-width:560px}
.q-row input{flex:1;background:rgba(15,28,63,0.7);border:1px solid rgba(123,92,255,0.25);border-radius:12px;color:#fff;font-size:14px;padding:12px 15px;outline:none}
.q-row button,.btn{background:linear-gradient(135deg,var(--p),var(--p2));border:none;color:#fff;font-weight:700;border-radius:12px;padding:12px 22px;cursor:pointer;font-family:'Space Grotesk',sans-serif}
.back-btn{background:none;border:1px solid rgba(123,92,255,0.3);color:var(--t3);border-radius:50px;padding:6px 16px;font-size:12px;cursor:pointer;margin-bottom:14px}

.cards{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;margin:10px 0 24px}
.card{width:150px}
.card .pos{text-align:center;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;min-height:14px}
.flip{width:150px;height:250px;perspective:1000px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.revealed .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;overflow:hidden;box-shadow:0 0 26px rgba(123,92,255,0.4);border:1px solid rgba(196,181,253,0.4)}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.face.back{background:radial-gradient(circle at 50% 40%,#3a2b7a,#140d2b);display:flex;align-items:center;justify-content:center;font-size:34px;color:rgba(196,181,253,0.6)}
.face.front{transform:rotateY(180deg);background:#140d2b}
.card .cname{text-align:center;font-size:12px;color:var(--t2);margin-top:8px}

.reading{max-width:660px;margin:0 auto;background:rgba(26,20,52,0.6);border:1px solid rgba(123,92,255,0.2);border-radius:16px;padding:22px 24px;display:flex;gap:16px;align-items:flex-start}
.reading .ny{flex-shrink:0;width:60px;height:60px;border-radius:50%;object-fit:cover;object-position:50% 15%;border:1px solid rgba(196,181,253,0.4);box-shadow:0 0 20px rgba(123,92,255,0.4)}
.reading .body{flex:1;font-size:14.5px;line-height:1.75;white-space:pre-wrap}
.reading .n{font-family:'Space Grotesk',sans-serif;color:#c4b5fd;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.status{text-align:center;color:var(--t3);font-size:13px;margin:16px 0}
.spin{width:26px;height:26px;border:3px solid rgba(123,92,255,0.2);border-top-color:var(--p);border-radius:50%;animation:s .7s linear infinite;margin:0 auto 10px}
@keyframes s{to{transform:rotate(360deg)}}
canvas#starry-canvas{position:fixed;inset:0;z-index:-1;pointer-events:none}
</style>
</head>
<body>
<script>(function(){var t=new URLSearchParams(location.search).get("token");if(!t){location.replace("/login.html");return;}fetch("/api/check-auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:t})}).then(function(r){return r.json();}).then(function(d){if(!d.valid)location.replace("/login.html");}).catch(function(){location.replace("/login.html");});})();</script>
<div class="wrap">
  <div class="intro">
    <div class="hero-nyxia"><div class="ny-glow"></div><img src="/NyXia_Tarots.png" class="ny-float" alt="NyXia" onerror="this.style.display='none'"></div>
    <h1>Ton tirage de <em>Tarot</em></h1>
    <p>L'Oracle NyXia allie ta symbolique à une lecture vivante. Choisis ton tirage — NyXia lit tes cartes pour toi. 🔮</p>
  </div>

  <div id="choicesView">
    <div class="choices" id="choices"></div>
  </div>

  <div class="stage" id="stage">
    <button class="back-btn" onclick="resetTirage()">‹ Autre tirage</button>
    <div class="q-row" id="qRow">
      <input id="question" placeholder="Ta question (optionnel selon le tirage)…">
      <button onclick="drawTirage()">Tirer les cartes</button>
    </div>
    <div id="status" class="status" style="display:none"></div>
    <div class="cards" id="cards"></div>
    <div class="reading" id="reading" style="display:none"></div>
  </div>
</div>

<script>
var token = new URLSearchParams(location.search).get('token') || '';
var BACK_IMG = '/BackTarotNyXiaCard.png';
var currentType = null;

var TIRAGES = [
  { id:'carte_jour', ic:'☀️', t:'Carte du jour', d:'Pour faire le point sur ta journée.' },
  { id:'oui_non', ic:'⚖️', t:'Oui / Non', d:'Pour une question simple.' },
  { id:'choix', ic:'🔀', t:'Tirage du Choix', d:'Pour choisir entre deux options.' },
  { id:'amour', ic:'💜', t:'Tirage Amour', d:'Pour explorer ton avenir sentimental.' },
  { id:'relationnel', ic:'🤝', t:'Tirage Relationnel', d:'Pour faire le point sur une relation.' },
  { id:'question', ic:'✨', t:'Tirage Question', d:'Pour une réponse précise, pro ou perso.' }
];

var grid = document.getElementById('choices');
TIRAGES.forEach(function(tir){
  var el = document.createElement('div');
  el.className = 'choice';
  el.innerHTML = '<div class="ic">' + tir.ic + '</div><h3>' + tir.t + '</h3><p>' + tir.d + '</p>';
  el.addEventListener('mousemove', function(e){
    var r = el.getBoundingClientRect();
    el.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    el.style.setProperty('--my', (e.clientY - r.top) + 'px');
  });
  el.addEventListener('click', function(){ chooseTirage(tir.id); });
  grid.appendChild(el);
});

function chooseTirage(id){
  currentType = id;
  document.getElementById('choicesView').style.display = 'none';
  document.getElementById('stage').classList.add('on');
  document.getElementById('cards').innerHTML = '';
  document.getElementById('reading').style.display = 'none';
  document.getElementById('question').value = '';
}
function resetTirage(){
  currentType = null;
  document.getElementById('stage').classList.remove('on');
  document.getElementById('choicesView').style.display = 'block';
}

function drawTirage(){
  var question = document.getElementById('question').value.trim();
  var status = document.getElementById('status');
  var cardsEl = document.getElementById('cards');
  var reading = document.getElementById('reading');
  cardsEl.innerHTML = ''; reading.style.display = 'none';
  status.style.display = 'block';
  status.innerHTML = '<div class="spin"></div>NyXia mélange et tire tes cartes…';

  fetch('/api/tirage', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ token: token, type: currentType, question: question }) })
  .then(function(r){ return r.json(); })
  .then(function(data){
    status.style.display = 'none';
    if(!data.success){ status.style.display='block'; status.textContent = data.error || 'Le voile est trouble, réessaie.'; return; }
    data.cards.forEach(function(c, i){
      var card = document.createElement('div'); card.className = 'card';
      var front = c.hasImage
        ? '<div class="face front"><img src="/api/cards/image?id=' + encodeURIComponent(c.id) + '&token=' + encodeURIComponent(token) + '" alt=""></div>'
        : '<div class="face front" style="display:flex;align-items:center;justify-content:center;color:#c4b5fd;padding:10px;text-align:center;font-family:Cormorant Garamond,serif;font-size:18px">' + c.name + '</div>';
      card.innerHTML =
        '<div class="pos">' + c.position + '</div>' +
        '<div class="flip"><div class="flip-in">' +
          '<div class="face back"><img src="' + BACK_IMG + '" alt="" onerror="this.replaceWith(document.createTextNode(\'✦\'))"></div>' +
          front +
        '</div></div>' +
        '<div class="cname">' + c.name + '</div>';
      cardsEl.appendChild(card);
      var flip = card.querySelector('.flip');
      flip.addEventListener('click', function(){ flip.classList.add('revealed'); });
      setTimeout(function(){ flip.classList.add('revealed'); }, 500 + i * 450);
    });
    reading.style.display = 'flex';
    reading.innerHTML = '<img class="ny" src="/NyXia_Tarots.png" alt="NyXia" onerror="this.style.display=\'none\'"><div class="body"><div class="n">✦ La lecture de NyXia</div>' + escapeHtml(data.interpretation) + '</div>';
    reading.scrollIntoView({ behavior:'smooth', block:'nearest' });
  })
  .catch(function(){ status.style.display='block'; status.textContent = 'Erreur de connexion.'; });
}
function escapeHtml(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML.replace(/\n/g,'<br>'); }
</script>
<canvas id="starry-canvas"></canvas>
<script src="/js/starry-bg.js"></script>
</body>
</html>
